name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Audit · npm + commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: API · audit (high)
        working-directory: api
        run: npm audit --omit=dev --audit-level=high || true
      - name: Web · audit (high)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high || true
      - name: Commitlint last commit
        run: |
          npm install -g @commitlint/{cli,config-conventional}
          echo '{ "extends": ["@commitlint/config-conventional"] }' > commitlint.config.json
          git log -1 --pretty=%B | npx commitlint --config commitlint.config.json || true

  api:
    name: API · Node 14
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Upgrade npm (lockfileVersion 3 support)
        run: npm install -g npm@8

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test + coverage gate
        run: npm test

      - name: Coverage summary
        run: npm run coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: api/coverage
          if-no-files-found: ignore

  web:
    name: Web · Node 16
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --ci

      - name: Build
        run: npm run build

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: web/dist
          if-no-files-found: ignore

  docker:
    name: Docker · Build images
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t toolbox-api:ci ./api
      - name: Build Web image
        run: docker build --build-arg API_BASE_URL=http://localhost:3000 -t toolbox-web:ci ./web

  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install API
        working-directory: api
        run: npm ci

      - name: Start API in background
        working-directory: api
        run: |
          nohup npm start > api.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://localhost:3000/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo 'API failed to start'; cat api.log; exit 1

      - name: Install Web
        working-directory: web
        run: npm ci

      - name: Start Web (webpack-dev-server) in background
        working-directory: web
        env:
          API_BASE_URL: http://localhost:3000
        run: |
          nohup npm start > web.log 2>&1 &
          for i in {1..60}; do
            if curl -sf http://localhost:8080/ > /dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Web failed to start'; cat web.log; exit 1

      - name: Install Playwright deps
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: e2e
        env:
          WEB_URL: http://localhost:8080
          API_BASE_URL: http://localhost:3000
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
