services:
  api:
    build:
      context: ./api
    image: toolbox-api:local
    container_name: toolbox-api
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - toolbox-net

  web:
    build:
      context: ./web
      args:
        API_BASE_URL: http://localhost:3000
    image: toolbox-web:local
    container_name: toolbox-web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - toolbox-net

networks:
  toolbox-net:
    driver: bridge
